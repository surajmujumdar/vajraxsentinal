services:
  # =========================================================================
  # 1. UNIFIED BACKEND API SERVICE (FastAPI - VAJRA Threat Intel + SENTINEL)
  # =========================================================================
  - type: web
    name: vajraxsentinel-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: VAJRA_ENABLED
        value: "true"
      - key: SENTINEL_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: expert
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"

  # =========================================================================
  # 2. UNIFIED FRONTEND DASHBOARD (Next.js 15 Static Site on Global CDN)
  # =========================================================================
  - type: web
    name: vajraxsentinel-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
