# Semgrep SAST Configuration for Vajra / Sentinel
# https://github.com/semgrep/semgrep

rules:
  # ──── PYTHON / FASTAPI RULES ────
  - id: python-fastapi-cors-wildcard
    languages: [python]
    severity: WARNING
    message: "CORS middleware is configured with allow_origins=['*'] alongside allow_credentials=True, which can lead to sensitive data leakage."
    metadata:
      cwe: ["CWE-942: Permissive Cross-Origin Resource Sharing Policy"]
      owasp: ["A01:2021 - Broken Access Control"]
      category: security
      technology: [fastapi]
    patterns:
      - pattern-either:
          - pattern: 'CORSMiddleware(..., allow_origins=["*"], allow_credentials=True, ...)'
          - pattern: 'app.add_middleware(CORSMiddleware, ..., allow_origins=["*"], allow_credentials=True, ...)'

  - id: python-sql-injection-raw-query
    languages: [python]
    severity: ERROR
    message: "Potential SQL Injection detected: User input formatted directly into raw SQL query."
    metadata:
      cwe: ["CWE-89: SQL Injection"]
      owasp: ["A03:2021 - Injection"]
      category: security
    patterns:
      - pattern-either:
          - pattern: '$DB.execute(f"... {$VAR} ...")'
          - pattern: '$DB.execute("..." % $VAR)'
          - pattern: '$DB.execute("...".format($VAR))'
      - pattern-not: '$DB.execute("...", params)'

  - id: python-insecure-deserialization-pickle
    languages: [python]
    severity: ERROR
    message: "Avoid using pickle.loads() on untrusted user data as it can lead to Remote Code Execution (RCE)."
    metadata:
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      category: security
    pattern: 'pickle.loads(...)'

  - id: python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: "Invoking subprocess with shell=True and dynamic arguments can lead to OS Command Injection."
    metadata:
      cwe: ["CWE-78: OS Command Injection"]
      owasp: ["A03:2021 - Injection"]
      category: security
    patterns:
      - pattern-either:
          - pattern: 'subprocess.$FUNC(..., shell=True, ...)'
          - pattern: 'asyncio.create_subprocess_shell(..., ...)'
      - pattern-not: 'subprocess.$FUNC(["...", ...], shell=True, ...)'

  - id: python-jwt-insecure-none-algorithm
    languages: [python]
    severity: ERROR
    message: "JWT decode is allowing 'none' algorithm or insecure verification bypass."
    metadata:
      cwe: ["CWE-345: Insufficient Verification of Data Authenticity"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      category: security
    patterns:
      - pattern-either:
          - pattern: 'jwt.decode(..., algorithms=["none", ...], ...)'
          - pattern: 'jwt.decode(..., options={"verify_signature": False}, ...)'

  # ──── TYPESCRIPT / REACT / NEXT.JS RULES ────
  - id: react-dangerously-set-inner-html
    languages: [typescript, javascript]
    severity: WARNING
    message: "dangerouslySetInnerHTML found. Ensure user inputs are sanitized with DOMPurify to prevent Cross-Site Scripting (XSS)."
    metadata:
      cwe: ["CWE-79: Cross-site Scripting"]
      owasp: ["A03:2021 - Injection"]
      category: security
      technology: [react, nextjs]
    pattern: '<$ELEM ... dangerouslySetInnerHTML={{ __html: $VAL }} ... />'

  - id: react-unvalidated-href-javascript
    languages: [typescript, javascript]
    severity: ERROR
    message: "Potential XSS via unvalidated javascript: URI in href."
    metadata:
      cwe: ["CWE-79: Cross-site Scripting"]
      owasp: ["A03:2021 - Injection"]
      category: security
    pattern: '<a ... href={"javascript:" + $VAL} ... />'

  - id: js-insecure-eval
    languages: [typescript, javascript]
    severity: ERROR
    message: "Use of eval() or Function constructor allows execution of arbitrary code."
    metadata:
      cwe: ["CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"]
      owasp: ["A03:2021 - Injection"]
      category: security
    patterns:
      - pattern-either:
          - pattern: 'eval(...)'
          - pattern: 'new Function(...)'
          - pattern: 'window.eval(...)'

  # ──── SECRETS & HARDCODED CREDENTIALS ────
  - id: hardcoded-jwt-secret-or-api-key
    languages: [python, typescript, javascript]
    severity: ERROR
    message: "Detected hardcoded secret or API token. Store sensitive keys in environment variables (.env)."
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      category: security
    patterns:
      - pattern-either:
          - pattern: '$SECRET = "sk_live_..."'
          - pattern: '$SECRET = "ghp_..."'
          - pattern: '$SECRET = "AKIA[0-9A-Z]{16}"'
          - pattern: 'JWT_SECRET = "secret"'
          - pattern: 'SECRET_KEY = "secret123"'
